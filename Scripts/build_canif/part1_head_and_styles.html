<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AUTOSAR Classic CanIf Interactive Simulator &amp; Technical Handbook</title>
<style>
:root, [data-theme="dark"] {
  --bg: #0b101b;
  --bg-elev: #111827;
  --panel: #151e30;
  --panel-2: #1b263b;
  --panel-3: #0f172a;
  --bdr: #2a3954;
  --bdr-soft: #1f2b42;
  --txt: #e5edf7;
  --txt-soft: #c2d0e4;
  --mut: #8fa3bf;
  --pri: #38bdf8;
  --pri-bg: rgba(56, 189, 248, 0.14);
  --acc: #60a5fa;
  --ok: #22c55e;
  --ok-bg: rgba(34, 197, 94, 0.14);
  --warn: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.15);
  --err: #ef4444;
  --err-bg: rgba(239, 68, 68, 0.15);
  --pur: #a78bfa;
  --pur-bg: rgba(167, 139, 250, 0.15);
  --cyan: #06b6d4;
  --cyan-bg: rgba(6, 182, 212, 0.14);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  --code-bg: #090e1a;
  /* Handbook SVG Theme Palette */
  --hb-bg: #0f172a;
  --hb-card: #162033;
  --hb-card2: #1e293b;
  --hb-bdr: #334155;
  --hb-txt: #e2e8f0;
  --hb-mut: #94a3b8;
  --hb-pri: #38bdf8;
  --hb-acc: #60a5fa;
  --hb-ok: #22c55e;
  --hb-warn: #f59e0b;
  --hb-err: #ef4444;
  --hb-pur: #a78bfa;
  --hb-cyan: #06b6d4;
}

[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-elev: #ffffff;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --panel-3: #eff4fa;
  --bdr: #cbd5e1;
  --bdr-soft: #e2e8f0;
  --txt: #0f172a;
  --txt-soft: #334155;
  --mut: #64748b;
  --pri: #0284c7;
  --pri-bg: rgba(2, 132, 199, 0.1);
  --acc: #2563eb;
  --ok: #16a34a;
  --ok-bg: rgba(22, 163, 74, 0.12);
  --warn: #d97706;
  --warn-bg: rgba(217, 119, 6, 0.12);
  --err: #dc2626;
  --err-bg: rgba(220, 38, 38, 0.11);
  --pur: #7c3aed;
  --pur-bg: rgba(124, 58, 237, 0.1);
  --cyan: #0891b2;
  --cyan-bg: rgba(8, 145, 178, 0.1);
  --shadow: 0 10px 28px rgba(15, 23, 42, 0.14);
  --code-bg: #f8fafc;
  /* Handbook SVG Theme Palette */
  --hb-bg: #f8fafc;
  --hb-card: #ffffff;
  --hb-card2: #f1f5f9;
  --hb-bdr: #cbd5e1;
  --hb-txt: #0f172a;
  --hb-mut: #475569;
  --hb-pri: #0284c7;
  --hb-acc: #2563eb;
  --hb-ok: #16a34a;
  --hb-warn: #d97706;
  --hb-err: #dc2626;
  --hb-pur: #7c3aed;
  --hb-cyan: #0891b2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  overflow-x: hidden;
}
code, pre, .mono {
  font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
}
button, select, input {
  font-family: inherit;
  font-size: inherit;
  color: var(--txt);
}
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--mut); }

/* ================= STICKY UNIFIED HEADER ================= */
.hdr {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--bdr);
  padding: 6px 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
}
.hdr-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.hdr-row + .hdr-row {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--bdr-soft);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-badge {
  background: linear-gradient(135deg, var(--pri), var(--cyan));
  color: #fff;
  font-weight: 800;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.4px;
}
.brand-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--txt);
}
.brand-sub {
  font-size: 11px;
  color: var(--mut);
}
.view-switch {
  display: flex;
  gap: 4px;
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  padding: 2px;
}
.view-btn {
  border: none;
  background: transparent;
  color: var(--mut);
  padding: 4px 11px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  transition: all 0.15s;
}
.view-btn.active {
  background: var(--pri);
  color: #061321;
}
.hdr-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.btn {
  background: var(--panel-2);
  border: 1px solid var(--bdr);
  color: var(--txt);
  padding: 4px 9px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.14s;
}
.btn:hover:not(:disabled) {
  border-color: var(--pri);
  background: var(--pri-bg);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-pri { background: var(--pri-bg); border-color: var(--pri); color: var(--pri); }
.btn-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.btn-warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.btn-err { background: var(--err-bg); border-color: var(--err); color: var(--err); }
.btn-pur { background: var(--pur-bg); border-color: var(--pur); color: var(--pur); }
.btn-cyan { background: var(--cyan-bg); border-color: var(--cyan); color: var(--cyan); }
.btn-sm { padding: 3px 7px; font-size: 11px; }

.scen-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  flex: 1;
}
.scen-select {
  background: var(--panel-2);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 4px 8px;
  min-width: 260px;
  max-width: 370px;
  font-size: 12px;
  font-weight: 600;
}
.step-pill {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--pri);
}
.clock-box {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  padding: 2px 7px;
  border-radius: 6px;
  flex-wrap: wrap;
}
.clock-val {
  font-weight: 800;
  color: var(--cyan);
  min-width: 48px;
  text-align: right;
  font-size: 11.5px;
}
.hdr-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.state-badge {
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  border: 1px solid var(--bdr);
  background: var(--panel-2);
}
.sb-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.sb-warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.sb-err { color: var(--err); border-color: var(--err); background: var(--err-bg); }
.sb-deact { color: var(--mut); border-color: var(--bdr); background: var(--panel-3); }
.sb-cyan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-bg); }
.sb-pur { color: var(--pur); border-color: var(--pur); background: var(--pur-bg); }

/* ================= ZERO-SCROLL 3-COLUMN WORKSPACE ================= */
.hidden { display: none !important; }
.workspace {
  display: grid;
  grid-template-columns: 375px minmax(0, 1fr) 440px;
  gap: 8px;
  padding: 8px 10px;
  height: calc(100vh - 88px);
  overflow: hidden;
  align-items: stretch;
}
.col-left, .col-center, .col-right {
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 100%;
  overflow-y: auto;
  padding-right: 2px;
}
@media (max-width: 1380px) {
  .workspace {
    grid-template-columns: 345px minmax(0, 1fr) 390px;
  }
}
@media (max-width: 1120px) {
  .workspace {
    grid-template-columns: 1fr;
    height: auto;
    overflow: visible;
  }
  .col-left, .col-center, .col-right {
    height: auto;
    overflow: visible;
  }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--bdr);
  border-radius: 9px;
  overflow: visible;
  flex-shrink: 0;
}
.panel-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--bdr);
  border-radius: 9px 9px 0 0;
  gap: 6px;
  flex-wrap: wrap;
}
.panel-title {
  font-weight: 800;
  font-size: 12px;
  color: var(--txt);
  display: flex;
  align-items: center;
  gap: 6px;
}
.panel-sub {
  font-size: 10.5px;
  color: var(--mut);
  font-weight: 600;
}
.panel-body {
  padding: 8px 10px;
}

/* ================= LEFT COLUMN: QUICK ACTIONS & WHAT-IF ================= */
.qa-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
}
.qa-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
}
.qa-btn {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  transition: all 0.14s;
}
.qa-btn:hover { border-color: var(--pri); background: var(--pri-bg); }
.qa-btn.qa-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.qa-btn.qa-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.qa-btn.qa-err { border-color: var(--err); color: var(--err); background: var(--err-bg); }
.qa-btn.qa-pur { border-color: var(--pur); color: var(--pur); background: var(--pur-bg); }
.qa-btn.qa-cyan { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-bg); }

.scen-desc-box {
  font-size: 11.5px;
  color: var(--txt-soft);
  background: var(--panel-3);
  border: 1px solid var(--bdr-soft);
  border-radius: 6px;
  padding: 6px 8px;
  margin-bottom: 6px;
}
.whatif-grid {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.whatif-btn {
  text-align: left;
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: var(--txt-soft);
  transition: all 0.14s;
}
.whatif-btn:hover {
  border-color: var(--pur);
  background: var(--pur-bg);
  color: var(--txt);
}

/* ================= ECUC CONFIG TABS & FIELDS ================= */
.cfg-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  padding: 6px 8px 4px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--bdr);
}
.cfg-tab {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 5px;
  padding: 4px 5px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--mut);
  cursor: pointer;
  text-align: center;
}
.cfg-tab.active {
  background: var(--pri-bg);
  border-color: var(--pri);
  color: var(--pri);
}
.cfg-pane {
  padding: 6px 8px;
  max-height: 255px;
  overflow-y: auto;
}
.cfg-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  border: 1px solid transparent;
  transition: background 0.12s;
}
.cfg-row:hover {
  background: var(--panel-3);
  border-color: var(--bdr-soft);
}
.cfg-lbl {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  color: var(--txt-soft);
  cursor: help;
  min-width: 0;
}
.cfg-lbl span.cfg-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cfg-i {
  font-size: 10px;
  color: var(--pri);
  background: var(--pri-bg);
  border-radius: 4px;
  padding: 0 4px;
  font-weight: 800;
  flex-shrink: 0;
  cursor: pointer;
}
.cfg-ctrl {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.cfg-ctrl input[type="number"],
.cfg-ctrl input[type="text"],
.cfg-ctrl select {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 11px;
  max-width: 144px;
}
.cfg-ctrl input[type="number"] { width: 68px; text-align: right; }
.cfg-ctrl input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--pri);
  cursor: pointer;
}
.cfg-warn-banner {
  margin-top: 4px;
  padding: 4px 7px;
  border-radius: 5px;
  background: var(--warn-bg);
  border: 1px solid var(--warn);
  color: var(--warn);
  font-size: 10.5px;
  font-weight: 600;
}

/* ================= CENTER PANEL 1: CAN_IDTYPE ANATOMY, HOH / TXBUFFER / RXFILTER & DUAL 8-BIT ================= */
.tier-split {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.canid-strip {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 7px;
  padding: 6px 9px;
}
.canid-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}
.canid-fields {
  display: grid;
  grid-template-columns: 1.05fr 1.05fr 0.7fr 1.6fr;
  gap: 5px;
}
@media (max-width: 1260px) {
  .canid-fields { grid-template-columns: repeat(2, 1fr); }
}
.canid-cell {
  background: var(--panel);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 10.5px;
  transition: all 0.14s;
}
.canid-cell.clickable { cursor: pointer; }
.canid-cell.clickable:hover { border-color: var(--pri); background: var(--pri-bg); }
.canid-cell.active-pur { border-color: var(--pur); background: var(--pur-bg); }
.canid-cell.active-cyan { border-color: var(--cyan); background: var(--cyan-bg); }
.canid-cell-lbl { font-size: 9px; color: var(--mut); font-weight: 700; }
.canid-cell-val { font-size: 11px; font-weight: 800; color: var(--txt); margin-top: 1px; }

.hoh-split-grid {
  display: grid;
  grid-template-columns: 1.12fr 1fr;
  gap: 7px;
}
@media (max-width: 1260px) {
  .hoh-split-grid { grid-template-columns: 1fr; }
}
.hoh-card {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 7px;
  padding: 6px 8px;
}
.hoh-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 5px;
}
.hth-row {
  background: var(--panel);
  border: 1px solid var(--bdr-soft);
  border-radius: 5px;
  padding: 4px 7px;
  margin-bottom: 4px;
  font-size: 10.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}
.hth-row.busy { border-color: var(--warn); background: var(--warn-bg); }
.hth-row.queued { border-color: var(--cyan); background: var(--cyan-bg); margin-left: 12px; }
.hth-row.empty { border-style: dashed; color: var(--mut); }

.rx-filter-step {
  background: var(--panel);
  border: 1px solid var(--bdr-soft);
  border-radius: 5px;
  padding: 4px 7px;
  margin-bottom: 4px;
  font-size: 10.5px;
  line-height: 1.4;
}
.rx-filter-step.pass { border-color: var(--ok); }
.rx-filter-step.fail { border-color: var(--err); background: var(--err-bg); }

.pill {
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  border: 1px solid var(--bdr);
  white-space: nowrap;
}
.pill-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.pill-warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.pill-err { color: var(--err); border-color: var(--err); background: var(--err-bg); }
.pill-cyan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-bg); }
.pill-pur { color: var(--pur); border-color: var(--pur); background: var(--pur-bg); }
.pill-mut { color: var(--mut); border-color: var(--bdr); background: var(--panel-2); }

.reg-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (max-width: 1280px) {
  .reg-grid { grid-template-columns: 1fr; }
}
.reg-card {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 7px;
  padding: 6px 8px;
}
.reg-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
  gap: 4px;
}
.reg-name { font-size: 11px; font-weight: 800; color: var(--txt); }
.reg-hex {
  font-size: 11px;
  font-weight: 800;
  color: var(--pri);
  background: var(--pri-bg);
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
.bit-row {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
}
.bit-box {
  background: var(--panel);
  border: 1px solid var(--bdr);
  border-radius: 5px;
  padding: 3px 2px;
  text-align: center;
  cursor: pointer;
  transition: all 0.14s;
}
.bit-box:hover { border-color: var(--pri); transform: translateY(-1px); }
.bit-box.on {
  border-color: var(--ok);
  background: var(--ok-bg);
}
.bit-box.on-warn {
  border-color: var(--warn);
  background: var(--warn-bg);
}
.bit-box.on-err {
  border-color: var(--err);
  background: var(--err-bg);
}
.bit-box.on-cyan {
  border-color: var(--cyan);
  background: var(--cyan-bg);
}
.bit-box.on-pur {
  border-color: var(--pur);
  background: var(--pur-bg);
}
.bit-box.bit-changed {
  box-shadow: 0 0 0 2px var(--cyan);
}
.bit-idx { font-size: 8.5px; color: var(--mut); }
.bit-val { font-size: 12px; font-weight: 900; line-height: 1.1; }
.bit-tag { font-size: 8px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ================= PANEL 2: LIVE METRICS & DUAL STATE MACHINES ================= */
.timer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
@media (max-width: 1260px) {
  .timer-grid { grid-template-columns: repeat(2, 1fr); }
}
.timer-card {
  background: var(--panel-3);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  padding: 5px 7px;
}
.timer-top {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  font-weight: 700;
  margin-bottom: 4px;
}
.timer-bar {
  height: 6px;
  background: var(--panel-2);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--bdr-soft);
}
.timer-fill {
  height: 100%;
  background: var(--pri);
  transition: width 0.2s;
}
.timer-fill.warn { background: var(--warn); }
.timer-fill.err { background: var(--err); }
.timer-fill.ok { background: var(--ok); }
.timer-fill.pur { background: var(--pur); }
