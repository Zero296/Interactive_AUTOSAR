<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTOSAR CanNM Interactive Simulator & Handbook — Mô Phỏng Luồng Xử Lý CanNM, Nm, ComM, CanSM, CanIf, PduR</title>
  <style>
    /* ===================== THEME VARIABLES (100% Offline, Pure CSS) ===================== */
    :root {
      --bg: #070b14; --panel: #0f1626; --panel2: #0b1220; --panel3: #141d31;
      --border: #1e293b; --border2: #2a3a55; --text: #e2e8f0; --muted: #8a9ab5; --dim: #5b6b85;
      --accent: #38bdf8; --accent2: #818cf8; --ok: #34d399; --warn: #fbbf24; --err: #f87171; --vio: #c084fc;
      --code: #020617; --node: #111a2e; --shadow: 0 6px 24px rgba(0,0,0,.35);
      --lab-text: #38bdf8; --amber-text: #fcd34d; --grid: rgba(148,163,184,.10);
      --glow: rgba(56, 189, 248, 0.45);
    }
    body.light {
      --bg: #eef2f7; --panel: #ffffff; --panel2: #f6f8fb; --panel3: #eef2f7;
      --border: #d5dde8; --border2: #c3cfdf; --text: #0f172a; --muted: #475569; --dim: #7b8aa0;
      --code: #f3f6fa; --node: #ffffff; --shadow: 0 6px 18px rgba(15,23,42,.08);
      --lab-text: #0284c7; --amber-text: #92400e; --accent: #0284c7; --grid: rgba(71,85,105,.12);
      --glow: rgba(2, 132, 199, 0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px; line-height: 1.45; min-height: 100vh; display: flex; flex-direction: column;
    }
    .mono, code, pre, .code { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
    code { font-size: .92em; background: var(--panel3); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; }
    b { font-weight: 700; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.55); border-radius: 9px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.85); }

    /* ===================== HEADER ===================== */
    .hdr { position: sticky; top: 0; z-index: 40; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
    .hdr-in { max-width: 1980px; margin: 0 auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 7px; }
    .hdr-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .hdr-row2 { border-top: 1px solid var(--border); padding-top: 7px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    h1 { font-size: 15px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
    .sub { font-size: 11px; color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
      font-size: 10.5px; font-weight: 700; background: rgba(56, 189, 248, 0.12); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35); white-space: nowrap;
    }
    body.light .badge { color: #0284c7; }
    .badge.amb { background: rgba(245,158,11,.13); color: #fbbf24; border-color: rgba(245,158,11,.35); }
    body.light .badge.amb { color: #b45309; }
    .badge.err { background: rgba(248,113,113,.15); color: #f87171; border-color: rgba(248,113,113,.4); }
    body.light .badge.err { color: #b91c1c; }
    .badge.ok { background: rgba(52,211,153,.13); color: #34d399; border-color: rgba(52,211,153,.35); }
    body.light .badge.ok { color: #047857; }
    .badge.vio { background: rgba(192,132,252,.13); color: #c084fc; border-color: rgba(192,132,252,.35); }
    body.light .badge.vio { color: #7e22ce; }
    .badge.indigo { background: rgba(129,140,248,.14); color: #818cf8; border-color: rgba(129,140,248,.38); }
    body.light .badge.indigo { color: #4338ca; }
    .badge.xs { padding: 1px 6px; font-size: 9.5px; border-radius: 5px; }
    .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 2px; }
    .ctrl { display: flex; align-items: center; gap: 5px; background: var(--panel2); border: 1px solid var(--border); padding: 4px 6px; border-radius: 9px; flex-wrap: wrap; }
    .vtabs { display: flex; gap: 4px; }
    .vtab {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2);
      background: var(--panel2); color: var(--muted); font-weight: 700; font-size: 12px;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .vtab.active { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: var(--text); }

    /* ===================== BUTTONS & CONTROLS ===================== */
    .row { display: flex; align-items: center; gap: 6px; }
    .wrap { flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border2);
      background: var(--panel3); color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: inherit; white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; filter: grayscale(0.25); }
    .btn.sm { padding: 4px 9px; font-size: 11.5px; }
    .btn.xs { padding: 2px 7px; font-size: 10.5px; border-radius: 5px; }
    .btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
    .btn.indigo { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .btn.amber { background: rgba(251,191,36,.12); color: #fbbf24; border-color: rgba(251,191,36,.38); }
    .btn.green { background: rgba(52,211,153,.12); color: #34d399; border-color: rgba(52,211,153,.38); }
    .btn.vio { background: rgba(192,132,252,.12); color: #c084fc; border-color: rgba(192,132,252,.38); }
    .btn.red { background: rgba(248,113,113,.12); color: #f87171; border-color: rgba(248,113,113,.38); }
    .btn.sky { background: rgba(56,189,248,.12); color: #38bdf8; border-color: rgba(56,189,248,.38); }
    body.light .btn.amber { color: #b45309; } body.light .btn.green { color: #047857; } body.light .btn.vio { color: #7e22ce; } body.light .btn.red { color: #b91c1c; } body.light .btn.sky { color: #0369a1; }
    .w100 { width: 100%; }

    /* ===================== FORM INPUTS & SELECTS ===================== */
    input[type=text], input[type=number], select, textarea {
      width: 100%; background: var(--code); border: 1px solid var(--border2);
      color: var(--text); border-radius: 6px; padding: 5px 7px; font-size: 12px;
      font-family: "JetBrains Mono", Consolas, monospace;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    input[type=checkbox] { accent-color: #38bdf8; width: 14px; height: 14px; cursor: pointer; }
    .f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 7px; border-radius: 7px; padding: 1px; }
    .f > label { font-size: 11px; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
    .hint { font-size: 10.5px; color: var(--dim); }
    .cfg-chip-link { cursor: pointer; color: var(--accent); font-size: 10px; margin-left: 4px; }
    .cfg-chip-link:hover { text-decoration: underline; }
    .ck {
      display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 7px; background: var(--panel2); margin-bottom: 6px; cursor: pointer; transition: border-color .15s;
    }
    .ck:hover { border-color: var(--border2); }
    .ck input { margin-top: 2px; flex: none; }
    .ck .nm { display: block; font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; font-weight: 700; }
    .ck .ds { display: block; font-size: 10.8px; color: var(--muted); }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 7px; }
    .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 6px; }
    .sub-t { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 8px 0 5px; }

    /* ===================== LAYOUT 3 COLUMNS ===================== */
    main {
      display: grid; grid-template-columns: 375px minmax(0, 1fr) 440px; gap: 10px;
      padding: 10px; max-width: 1980px; width: 100%; margin: 0 auto; flex: 1; align-items: start;
    }
    @media (max-width: 1480px) {
      main { grid-template-columns: 360px minmax(0, 1fr); }
      main > section:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }
    .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
    .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .panel-t { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    .panel-b { padding: 10px 12px; }
    .sticky-r { position: sticky; top: 116px; max-height: calc(100vh - 128px); display: flex; flex-direction: column; }
    .sticky-r > .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .sticky-r .panel-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .trace-title { color: #34d399; }
    body.light .trace-title { color: #047857; }
    .trace-hdr { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .trace-tools { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .trace-tools select { width: auto; min-width: 118px; padding: 3px 6px; font-size: 10.5px; border-radius: 5px; }
    .trace-list { display: flex; flex-direction: column; gap: 5px; max-height: calc(100vh - 255px); overflow-y: auto; padding-right: 2px; }
    .trace-item {
      background: var(--code); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 7px; padding: 6px 8px; font-size: 11px; transition: border-color .15s;
    }
    .trace-item.bus { border-left-color: #818cf8; }
    .trace-item.state { border-left-color: #fbbf24; }
    .trace-item.pn { border-left-color: #c084fc; }
    .trace-item.alert { border-left-color: #f87171; }
    .trace-item.init { border-left-color: #34d399; }
    .trace-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
    .trace-meta { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
    .trace-route { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trace-time { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; color: var(--dim); white-space: nowrap; flex: none; }
    .trace-api { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 700; font-size: 11px; color: var(--lab-text); word-break: break-word; line-height: 1.35; }
    .trace-desc { font-size: 10.8px; color: var(--muted); line-height: 1.38; margin-top: 2px; }
    @media (max-width: 1480px) {
      .sticky-r { position: static; max-height: none; }
      .sticky-r > .panel { flex: none; overflow: visible; }
      .trace-list { max-height: 460px; }
    }
    .muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 11px; } .mt8 { margin-top: 8px; } .mt4 { margin-top: 4px; }
    .hidden { display: none !important; }

    /* ===================== SUB-TABS (ECUC CONFIG & INSPECTOR) ===================== */
    .tabs { display: flex; gap: 3px; background: var(--panel2); padding: 3px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; }
    .tab {
      padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--muted);
      border: 1px solid transparent; background: transparent; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--panel3); color: var(--accent); border-color: var(--border2); }

    /* ===================== 8-BYTE NM PDU FRAME SLICER ===================== */
    .pdu-frame-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
    .pdu-byte-card {
      border: 1px solid var(--border2); border-radius: 8px; background: var(--panel2);
      padding: 6px 4px; text-align: center; transition: all .2s;
    }
    .pdu-byte-card.active-sni { border-color: #38bdf8; background: rgba(56, 189, 248, 0.10); }
    .pdu-byte-card.active-cbv { border-color: #fbbf24; background: rgba(251, 191, 36, 0.12); }
    .pdu-byte-card.active-pni { border-color: #c084fc; background: rgba(192, 132, 252, 0.12); }
    .pdu-byte-card.active-usr { border-color: #34d399; background: rgba(52, 211, 153, 0.10); }
    .pdu-byte-idx { font-size: 9.5px; font-weight: 800; color: var(--dim); text-transform: uppercase; }
    .pdu-byte-val { font-size: 13px; font-weight: 800; font-family: "JetBrains Mono", monospace; margin: 2px 0; }
    .pdu-byte-lbl { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===================== DUAL 8-BIT REGISTERS (PANEL 1B) ===================== */
    .bit-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 5px; }
    .bit-box {
      border: 1px solid var(--border2); border-radius: 7px; background: var(--panel2);
      padding: 5px 3px; text-align: center; cursor: pointer; transition: all .15s; user-select: none;
    }
    .bit-box:hover { border-color: var(--accent); transform: translateY(-1px); }
    .bit-box.on { border-color: #38bdf8; background: rgba(56, 189, 248, 0.18); box-shadow: 0 0 10px rgba(56, 189, 248, 0.35); }
    .bit-box.on.amb { border-color: #fbbf24; background: rgba(251, 191, 36, 0.22); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    .bit-box.on.ok { border-color: #34d399; background: rgba(52, 211, 153, 0.22); box-shadow: 0 0 10px rgba(52, 211, 153, 0.35); }
    .bit-box.on.vio { border-color: #c084fc; background: rgba(192, 132, 252, 0.22); box-shadow: 0 0 10px rgba(192, 132, 252, 0.35); }
    .bit-num { font-size: 9.5px; font-family: "JetBrains Mono", monospace; color: var(--dim); font-weight: 700; }
    .bit-val { font-size: 13px; font-weight: 800; font-family: "JetBrains Mono", monospace; margin: 1px 0; }
    .bit-name { font-size: 9.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
    .bit-box.on .bit-name { color: var(--text); }

    /* ===================== LIVE TIMERS & STATE MACHINE LAYOUT ===================== */
    .tm-sm-grid { display: grid; grid-template-columns: minmax(305px, 0.78fr) minmax(0, 1.32fr); gap: 12px; align-items: stretch; }
    @media (max-width: 1180px) { .tm-sm-grid { grid-template-columns: 1fr; } }
    .tm-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .sm-col { display: flex; flex-direction: column; min-width: 0; }
    .sec-subhdr { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 700; font-size: 11px; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }

    /* ===================== LIVE TIMERS & PROGRESS BARS ===================== */
    .timer-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; }
    .timer-card.compact { padding: 4px 8px; margin-bottom: 4px; border-radius: 7px; }
    .timer-card.compact:last-child { margin-bottom: 0; }
    .timer-card.compact .timer-h { font-size: 10.5px; margin-bottom: 3px; }
    .timer-card.compact .timer-track { height: 4px; }
    .timer-h { display: flex; align-items: center; justify-content: space-between; font-size: 11px; margin-bottom: 4px; gap: 6px; }
    .timer-track { width: 100%; height: 6px; background: var(--code); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .timer-bar { height: 100%; border-radius: 4px; transition: width .15s ease-out; }
    .tbl.compact td { padding: 4px 6px; font-size: 11px; }

    /* ===================== EXPANDED STATE MACHINE NODES ===================== */
    .sm-wrap { display: flex; flex-direction: column; gap: 7px; flex: 1; justify-content: space-between; }
    .sm-diagram { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .sm-node {
      border: 1px solid var(--border2); border-radius: 9px; background: var(--panel2);
      padding: 9px 11px; transition: all .2s; position: relative;
    }
    .sm-node.active {
      border-color: #38bdf8; background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.38);
    }
    .sm-mode-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .sm-subgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
    @media (max-width: 720px) { .sm-subgrid { grid-template-columns: 1fr; } }
    .sm-subnode {
      border: 1px solid var(--border); border-radius: 7px; background: var(--code);
      padding: 6px 8px; font-size: 10.5px; margin-top: 4px; font-family: "JetBrains Mono", monospace;
      transition: all .2s;
    }
    .sm-subgrid .sm-subnode { margin-top: 0; display: flex; flex-direction: column; gap: 3px; }
    .sm-subnode .sm-subtitle { font-weight: 700; font-size: 10.5px; color: var(--text); }
    .sm-subnode .sm-subdesc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.8px; color: var(--muted); font-weight: 400; line-height: 1.3; }
    .sm-subnode.active {
      border-color: #fbbf24; background: rgba(251, 191, 36, 0.15); color: #fbbf24; font-weight: 700;
    }
    .sm-subnode.active .sm-subtitle { color: #fbbf24; }
    body.light .sm-subnode.active, body.light .sm-subnode.active .sm-subtitle { color: #b45309; }
    .sm-subfooter {
      margin-top: 7px; padding-top: 5px; border-top: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 10px; color: var(--muted); font-family: "JetBrains Mono", monospace;
    }
    .sm-flow-strip {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
      padding: 1px 4px; font-size: 10px; font-family: "JetBrains Mono", monospace;
    }
    .sm-flow-tag {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 2px 8px; border-radius: 99px; font-weight: 700; border: 1px solid var(--border);
      background: var(--code); color: var(--muted); white-space: nowrap;
    }
    .sm-flow-tag.ok { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
    .sm-flow-tag.err { color: var(--err); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.08); }
    .sm-flow-tag.vio { color: var(--vio); border-color: rgba(192,132,252,.35); background: rgba(192,132,252,.08); }
    body.light .sm-flow-tag.ok { color: #047857; } body.light .sm-flow-tag.err { color: #b91c1c; } body.light .sm-flow-tag.vio { color: #7e22ce; }
    .sm-sleep-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
    @media (max-width: 720px) { .sm-sleep-row { grid-template-columns: 1fr; } }
    .sm-sleep-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }

    /* ===================== FLOATING CONFIG TOOLTIP (>1s HOVER DELAY) ===================== */
    #cfgTooltipPopup {
      position: fixed; pointer-events: none; z-index: 99999;
      background: rgba(15, 22, 38, 0.98); backdrop-filter: blur(8px);
      border: 1px solid #38bdf8; border-radius: 9px; padding: 10px 12px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.65); max-width: 440px; color: #e2e8f0;
      transition: opacity .15s; font-size: 12px; line-height: 1.4;
    }
    body.light #cfgTooltipPopup {
      background: rgba(255, 255, 255, 0.98); border-color: #0284c7;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.15); color: #0f172a;
    }
    #cfgTooltipPopup.hidden { display: none !important; }
    #cfgTooltipPopup .tt-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border2); padding-bottom: 6px; margin-bottom: 6px; }
    #cfgTooltipPopup .tt-t { font-weight: 800; font-size: 12.5px; color: var(--accent); }
    #cfgTooltipPopup .tt-p { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--muted); word-break: break-all; margin-top: 1px; }
    #cfgTooltipPopup .tt-sws { font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 700; background: rgba(56,189,248,.12); color: #38bdf8; border: 1px solid rgba(56,189,248,.35); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
    #cfgTooltipPopup .tt-d { font-size: 11.5px; color: var(--text); margin-bottom: 6px; }
    #cfgTooltipPopup .tt-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--code); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 10.5px; margin-bottom: 6px; }
    #cfgTooltipPopup .tt-note { background: rgba(251,191,36,.08); border-left: 3px solid #fbbf24; padding: 4px 8px; border-radius: 4px; font-size: 10.8px; color: var(--amber-text); }

    /* ===================== HANDBOOK MULTI-LEVEL ===================== */
    .hb-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 1500px; margin: 0 auto; width: 100%; padding: 10px 0; }
    .hb-nav1 { display: flex; gap: 4px; border-bottom: 2px solid var(--border2); padding-bottom: 4px; overflow-x: auto; }
    .hb-tab1 {
      padding: 7px 14px; border-radius: 8px 8px 0 0; background: transparent; border: 1px solid transparent;
      color: var(--muted); font-weight: 700; font-size: 12.5px; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .hb-tab1:hover { color: var(--text); }
    .hb-tab1.active { background: var(--panel2); color: var(--accent); border-color: var(--border2) var(--border2) transparent; }
    .hb-nav2 { display: flex; gap: 6px; padding: 8px 0; overflow-x: auto; flex-wrap: wrap; }
    .hb-pill {
      padding: 4px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
      background: var(--panel3); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .hb-pill:hover { color: var(--text); border-color: var(--border2); }
    .hb-pill.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .hb-content { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; line-height: 1.6; font-size: 13px; }
    .hb-content h2 { margin-top: 0; font-size: 16px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .hb-content h3 { font-size: 13.5px; color: #fbbf24; margin: 14px 0 6px; }
    .hb-content ul, .hb-content ol { padding-left: 20px; margin: 6px 0; }
    .hb-content li { margin-bottom: 4px; }
    .hb-content p { margin: 6px 0; }

    /* ===================== HANDBOOK SHAPE/BLOCK DIAGRAMS (OFFLINE SVG) ===================== */
    :root {
      --hb-bg: #080d1a; --hb-card: #111827; --hb-card2: #162033; --hb-stroke: #475569;
      --hb-sky: #38bdf8; --hb-sky-bg: rgba(56,189,248,0.13);
      --hb-ok: #34d399; --hb-ok-bg: rgba(52,211,153,0.13);
      --hb-warn: #fbbf24; --hb-warn-bg: rgba(251,191,36,0.14);
      --hb-err: #f87171; --hb-err-bg: rgba(248,113,113,0.14);
      --hb-vio: #c084fc; --hb-vio-bg: rgba(192,132,252,0.14);
      --hb-ind: #818cf8; --hb-ind-bg: rgba(129,140,248,0.14);
    }
    body.light {
      --hb-bg: #f8fafc; --hb-card: #ffffff; --hb-card2: #f1f5f9; --hb-stroke: #94a3b8;
      --hb-sky: #0284c7; --hb-sky-bg: rgba(2,132,199,0.10);
      --hb-ok: #047857; --hb-ok-bg: rgba(4,120,87,0.10);
      --hb-warn: #b45309; --hb-warn-bg: rgba(180,83,9,0.11);
      --hb-err: #dc2626; --hb-err-bg: rgba(220,38,38,0.10);
      --hb-vio: #7e22ce; --hb-vio-bg: rgba(126,34,206,0.10);
      --hb-ind: #4338ca; --hb-ind-bg: rgba(67,56,202,0.10);
    }
    .hb-svg {
      width: 100%; height: auto; display: block;
      background: var(--hb-bg); border: 1px solid var(--border);
      border-radius: 8px; overflow: visible;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hb-svg .mono-svg { font-family: "JetBrains Mono", Consolas, monospace; }

    /* ===================== ABBREVIATION TABLE ===================== */
    .tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .tbl th, .tbl td { padding: 6px 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    .tbl th { background: var(--code); color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10.5px; }
    .tbl tr:hover td { background: rgba(56, 189, 248, 0.04); }
    mark { background: #fbbf24; color: #000; padding: 0 2px; border-radius: 2px; font-weight: 700; }

    /* ===================== MODAL EXPORT ===================== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99998;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--panel); border: 1px solid var(--border2); border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7); max-width: 900px; width: 100%; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-h { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-b { padding: 14px 16px; overflow: auto; flex: 1; }
    .modal-f { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--panel2); }

    /* ===================== MULTI-ECU BUS SIMULATION TAB ===================== */
    #viewMulti { max-width: 1980px; margin: 0 auto; width: 100%; padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    .multi-presets {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      padding: 7px 12px; border-top: 1px solid var(--border); background: var(--panel2);
    }
    .multi-arena { display: grid; gap: 10px; align-items: stretch; }
    .multi-arena.mode-2 { grid-template-columns: minmax(0, 1fr) 235px minmax(0, 1fr); }
    .multi-arena.mode-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .multi-arena.mode-3 .multi-bus-col { grid-column: 1 / -1; }
    @media (max-width: 1280px) {
      .multi-arena.mode-2 { grid-template-columns: 1fr; }
      .multi-arena.mode-3 { grid-template-columns: 1fr; }
    }
    .multi-ecu-panel { display: flex; flex-direction: column; min-width: 0; }
    .multi-ecu-panel .panel-h { background: rgba(56, 189, 248, 0.05); }
    .multi-ecu-panel.ecu-b .panel-h { background: rgba(129, 140, 248, 0.06); }
    .multi-ecu-panel.ecu-c .panel-h { background: rgba(192, 132, 252, 0.06); }
    .multi-ctrl-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; margin-bottom: 8px; }
    .multi-arena.mode-3 .multi-ctrl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 1580px) { .multi-ctrl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .multi-ctrl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .multi-ctrl-grid .btn { padding: 5px 6px; font-size: 11px; }
    .multi-btn-on { box-shadow: 0 0 0 1px currentColor inset; filter: brightness(1.08); }
    .multi-cfg-drawer {
      background: var(--code); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 9px; margin-bottom: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
    }
    .multi-cfg-drawer label { font-size: 10px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
    .multi-cfg-drawer input[type=number] { padding: 3px 5px; font-size: 11px; }
    .multi-timers-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    .multi-bus-col { display: flex; flex-direction: column; min-width: 0; }
    .multi-bus-bridge {
      flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
      background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 10px; box-shadow: var(--shadow);
    }
    .multi-bus-wire {
      background: var(--code); border: 1px solid var(--border); border-radius: 9px; padding: 8px;
      display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center;
    }
    .multi-bus-wire.active-tx { border-color: #38bdf8; box-shadow: 0 0 16px rgba(56, 189, 248, 0.25); }
    .multi-dir-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px;
      font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 800;
      background: rgba(56, 189, 248, 0.14); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4);
    }
    body.light .multi-dir-pill { color: #0284c7; }
    .multi-frame-box {
      width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 8px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-align: left;
    }
    .multi-stat-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 4px 7px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; font-size: 10.5px;
    }
    .multi-meta-bar {
      margin-top: 7px; padding: 5px 8px; background: var(--code); border: 1px solid var(--border); border-radius: 7px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px;
      font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    }

    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4), 0 0 14px rgba(56, 189, 248, 0.3); }
      50% { box-shadow: 0 0 0 5px rgba(56, 189, 248, 0), 0 0 22px rgba(56, 189, 248, 0.65); }
    }
    .pulse-glow { animation: pulseGlow 1.8s infinite; }
    .flash-border { animation: flashBorder .8s ease 2; }
    @keyframes flashBorder { 0%, 100% { border-color: var(--border2); } 50% { border-color: #fbbf24; } }
  </style>
</head>
